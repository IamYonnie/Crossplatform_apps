<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Demo — Model Viewer</title>
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    model-viewer {
      width: 100%;
      height: 80vh;
      background-color: #f0f0f0;
      --poster-color: transparent;
    }
    .hint {
      text-align: center;
      padding: 12px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <model-viewer
    id="ar-viewer"
    src="./model.glb"
    ios-src="./model.usdz"
    alt="3D-модель для демонстрации WebAR"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="./hdri.hdr"
    poster="./poster.webp"
  ></model-viewer>

  <p class="hint">
    На мобильном устройстве нажмите кнопку AR, чтобы разместить модель в пространстве.
  </p>

</body>
</html>
